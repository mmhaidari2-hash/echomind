name: Update Clerk Dependency

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-clerk-dependency.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Add Clerk
        working-directory: frontend
        run: npm install @clerk/nextjs@6.39.6 --save-exact
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet || git commit -m "build(auth): add Clerk frontend dependency"
          git push
