<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <title>EchoMind · Offline</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #090d16;
        color: #e8edf7;
        font-family: Inter, Vazirmatn, system-ui, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        box-sizing: border-box;
      }
      section {
        max-width: 22rem;
        text-align: center;
        border: 1px solid #1e293b;
        border-radius: 1.5rem;
        background: rgba(15, 23, 42, 0.6);
        padding: 2rem 1.5rem;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.35rem; }
      p { margin: 0; color: #94a3b8; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>EchoMind is offline</h1>
        <p>The assistant shell is cached on this device. Claims, OCR, and alerts need a connection.</p>
      </section>
    </main>
  </body>
</html>
